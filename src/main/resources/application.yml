spring:
  application:
    name: smart-expense-tracker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# OpenAPI / Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
