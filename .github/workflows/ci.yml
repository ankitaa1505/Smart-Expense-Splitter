name: Java CI/CD Pipeline with Maven

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.39
        env:
          MYSQL_DATABASE: smart_expense_tracker
          MYSQL_USER: expense_user
          MYSQL_PASSWORD: expense_secret_password
          MYSQL_ROOT_PASSWORD: root_secret_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Test Suite with Maven
        run: mvn clean test
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: smart_expense_tracker
          DB_USER: expense_user
          DB_PASSWORD: expense_secret_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
          JWT_EXPIRATION_MS: 86400000

      - name: Package Application Artifact
        run: mvn package -DskipTests
